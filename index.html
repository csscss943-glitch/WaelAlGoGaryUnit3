SSL ويظهر قفل أخضر، آمن."},{q:"POST يخفي البيانات في Body ولا تظهر في URL",ans:!0,fix:"صواب - مناسب لكلمات السر، GET يظهرها في الرابط."},{q:"JSON أخف من XML لنفس البيانات",ans:!0,fix:"صواب - JSON 150 بايت vs XML 350 بايت."},{q:"البيانات المفتوحة Open Data متاحة مجاناً من data.gov.eg",ans:!0,fix:"صواب - حكومية مجانية للابتكار."},{q:"display:flex يستخدم لعمل صف من الكروت المتجاوبة",ans:!0,fix:"صواب - مع gap و flex-wrap للمتجاوب."},{q:"CSS Grid مثالي للجداول مثل الجدول المدرسي",ans:!0,fix:"صواب - grid-template-columns لشبكات منتظمة."},{q:"حدث submit مع preventDefault يمنع إعادة التحميل",ans:!0,fix:"صواب - يسمح بالإرسال عبر fetch API."},{q:"localStorage يحذف تلقائياً عند إغلاق المتصفح",ans:!1,fix:"خطأ - LocalStorage يبقى، SessionStorage يحذف عند الإغلاق."}],X0=[{q:"اشرح نموذج العميل والخادم ودور كل من المتصفح والخادم في تطبيق الويب.",a:"نموذج العميل والخادم هو أساس تطبيقات الويب: العميل هو جهاز المستخدم والمتصفح الذي يرسل طلبات Request لعرض بيانات، والخادم جهاز قوي متصل دائماً بالإنترنت يستقبل الطلبات ويعالجها ويرسل استجابة Response. دور المتصفح: تفسير HTML/CSS/JS وعرض الصفحة وتنفيذ JS وإرسال الطلبات. دور الخادم: استقبال الطلبات، التحقق من الصلاحيات، تنفيذ منطق Backend، الاستعلام من قاعدة البيانات، وإرجاع النتيجة بصيغة HTML أو JSON."},{q:"ما الفرق بين REST و SOAP مع ذكر مثال لاستخدام كل منهما؟",a:"REST: حديث، يعتمد على HTTP، عديم الحالة، يستخدم JSON، بسيط وسريع، يستخدم Methods القياسية GET/POST/PUT/DELETE، مثال: API موقع طقس أو متجر إلكتروني. SOAP: بروتوكول قديم صارم، يعتمد على XML فقط، يستخدم WSDL لوصف الخدمة، يحتاج معايير أمان عالية ومعقد، مثال: أنظمة البنوك والتحويلات المالية والخدمات الحكومية القديمة التي تتطلب أماناً عالياً."},{q:"وضح الفرق بين HTML و CSS و JavaScript مع مثال كود بسيط يوضح تكاملهم.",a:"HTML للبنية: مثل <h1>مرحبا</h1> و <button>اضغط</button>. CSS للتنسيق: مثل h1{color:#064e3b;} و button{background:#f59e0b;}. JavaScript للتفاعل: مثل document.querySelector('button').onclick = ()=>{alert('تم التحميل')}. المثال المتكامل: HTML يبني زر، CSS يجمله باللون البرتقالي، JavaScript يجعله عند الضغط يغير نص فقرة من 'اضغط للتحميل' إلى 'تم التحميل من الخادم'. هذا الفصل يجعل الصيانة أسهل ويتبع معايير تطبيقات الويب الحديثة."},{q:"ما الفرق بين الموقع الثابت والديناميكي وتطبيق الويب؟",a:"الثابت: HTML+CSS فقط، محتوى لا يتغير إلا بتعديل الكود، قراءة فقط، مثل موقع تعريفي. الديناميكي: HTML+CSS+JS+DB، يتغير حسب المستخدم، تفاعل بسيط تعليقات وتسجيل. تطبيق الويب: Frontend+Backend+Database+API، منطق معقد، إنشاء وتعديل وحذف، مثل Gmail وFacebook ونظام LMS - كل تفاعل يمر عبر خادم وقاعدة بيانات."},{q:"اشرح مكونات تطبيق الويب الثلاثة Frontend و Backend و Database.",a:"Frontend: ما يراه المستخدم - HTML للهيكل، CSS للتنسيق، JS للتفاعل - مسؤولية عرض البيانات القادمة من الخادم بشكل جذاب. Backend: العقل المدبر على الخادم - يعالج الطلبات، ينفذ منطق العمل، يتعامل مع DB، يؤمن التطبيق - بلغات Python, PHP, Node.js. Database: مخزن منظم للبيانات الدائمة مثل حسابات المستخدمين والدرجات - MySQL, PostgreSQL, MongoDB - تتواصل مع الخلفية لحفظ واسترجاع."},{q:"ما الفرق بين HTTP و HTTPS؟ ولماذا تستخدم وزارة التربية HTTPS؟",a:"HTTP: نص واضح غير آمن قابل للتنصت في الشبكات العامة، بدون تشفير. HTTPS: HTTP + تشفير TLS/SSL + مصادقة + قفل أخضر، البيانات مشفرة لا يمكن قراءتها حتى لو اعترضت. وزارة التربية تستخدم HTTPS إجبارياً لحماية كلمات سر الطلاب ونتائجهم من السرقة في الواي فاي العام والمقاهي."},{q:"اشرح طرق الطلب الأربعة GET, POST, PUT, DELETE مع مثال لكل.",a:"GET: قراءة بيانات - البيانات في URL بعد ? - قابلة للمشاركة كمفضلة - مثال GET /api/students. POST: إنشاء بيانات - البيانات في Body مخفية - لكلمات السر والملفات - مثال POST /api/students {name}. PUT: تحديث كامل لسجل موجود - استبدال كامل - مثال PUT /api/students/5. DELETE: حذف مورد محدد - يحتاج صلاحيات - مثال DELETE /api/comments/42 يرجع 204 نجاح بدون محتوى."},{q:"ما هي API؟ وكيف يستخدم موقع مدرسة API الطقس؟",a:"API واجهة تسمح لتطبيقين مختلفين بالتواصل وتبادل البيانات بضوابط. مثال: موقع الطقس يقدم API يعطي بيانات الطقس بصيغة JSON، موقع المدرسة يستخدم fetch('https://api.weather.com/current?city=Cairo') ثم res.json() ثم يعرض درجة الحرارة في صفحته بدون بناء نظام طقس - فقط استدعاء API جاهز يتحدث كل ساعة."},{q:"قارن بين JSON و XML من حيث الحجم والاستخدام.",a:"JSON: {name: أحمد, grade:85} - خفيف 150 بايت، سهل القراءة، يتحول لكائن JS بـ JSON.parse()، يدعم مصفوفات وكائنات متداخلة، معيار REST الحديث. XML: <name>أحمد</name> - أثقل 350 بايت لنفس البيانات، وسم فتح وإغلاق لكل قيمة، يحتاج Parser أثقل، لكن يدعم Attributes والتعليقات، يستخدم في SOAP والأنظمة البنكية القديمة."},{q:"اشرح رحلة طلب صفحة كاملة من كتابة الرابط حتى الظهور - 6 خطوات.",a:"1.DNS 50ms: تحويل الاسم إلى IP مثل دليل الهاتف. 2.TCP+TLS 100ms: إنشاء نفق آمن مشفر. 3.Request 20ms: GET /students/5 + Cookie. 4.Server 150ms: Apache+PHP يبحث في MySQL ويبني HTML - أطول خطوة. 5.Response 30ms: 200 OK + HTML. 6.Render 80ms: المتصفح يحلل DOM+CSSOM ويرسم. الإجمالي 430ms أقل من نصف ثانية."},{q:"ما الفرق بين Flexbox و Grid ومتى نستخدم كلاً؟",a:"Flexbox: display:flex - صف مرن - 3 كروت جنب بعض - gap 20px - flex-wrap متجاوب - مثالي للقوائم والكروت الأفقية. Grid: display:grid - شبكة منتظمة - grid-template-columns: 100px 1fr 1fr 1fr - مثالي للجداول والجدول المدرسي 3×4 - كل خلية متساوية. على الموبايل Flex يصبح عمودي بسهولة، Grid يحافظ على شكل الجدول."},{q:"كيف يعمل التحقق من النموذج بـ JavaScript قبل الإرسال للخادم؟ وما فائدته؟",a:"نستخدم submit event + preventDefault لمنع الإرسال التلقائي، ثم نتحقق: if(pass.length<8) خطأ، if(!/[0-9]/.test(pass)) يجب رقم، if(!/[A-Z]/.test(pass)) حرف كبير. لو نجح نرسل fetch POST. الفائدة: توفير طلبات خاطئة للخادم، استجابة فورية للمستخدم، تقليل حمل الشبكة، تحسين تجربة المستخدم - لا ينتظر رد الخادم ليعرف أن كلمة السر قصيرة."}];as.createRoot(document.getElementById("root")).render(i(is.default.StrictMode,{children:i(mi,{})}));

  <script>(function(){function m(a){var h=a.getAttribute("href");if(!h)return;try{var u=new URL(h,document.baseURI);if((u.protocol==="http:"||u.protocol==="https:")&&u.host!==location.host){a.target="_blank";a.rel="noopener noreferrer";}}catch(e){}}function s(){document.querySelectorAll("a[href]").forEach(m);}if(document.readyState!=="loading"){s();}else{document.addEventListener("DOMContentLoaded",s);}document.addEventListener("click",function(e){var a=e.target&&e.target.closest&&e.target.closest("a[href]");if(a){m(a);}},true);})();</script>
